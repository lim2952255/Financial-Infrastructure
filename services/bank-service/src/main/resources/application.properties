spring.application.name=bank-service
server.port=${SERVER_PORT:8081}
finance.institution-id=${INSTITUTION_ID:BANK_A}
finance.kftc-base-url=${KFTC_BASE_URL:http://localhost:8090}
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
demo.seed-enabled=${DEMO_SEED_ENABLED:false}
demo.customer-name=${DEMO_CUSTOMER_NAME:Demo Customer}
demo.account-number=${DEMO_ACCOUNT_NUMBER:000-000-0000}
demo.account-balance=${DEMO_ACCOUNT_BALANCE:0}
demo.secondary-customer-name=${DEMO_SECONDARY_CUSTOMER_NAME:Demo Receiver}
demo.secondary-account-number=${DEMO_SECONDARY_ACCOUNT_NUMBER:000-000-0001}
demo.secondary-account-balance=${DEMO_SECONDARY_ACCOUNT_BALANCE:0}
