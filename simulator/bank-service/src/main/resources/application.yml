spring:
  application:
    name: bank-service
  # Bank A와 Bank B는 같은 애플리케이션을 사용하지만 서로 다른 DB 환경변수를 받는다.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    # 학습용 시뮬레이션이므로 별도 마이그레이션 도구 없이 테이블을 준비한다.
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

bank:
  # 현재 인스턴스의 은행과 HTTP로 통신할 상대 은행을 구분한다.
  id: ${BANK_ID}
  counterpart-id: ${BANK_COUNTERPART_ID}
  counterpart-base-url: ${BANK_COUNTERPART_BASE_URL}

simulation:
  seed:
    # 활성화하면 Docker 시작 시 은행별 데모 계좌를 한 번 생성한다.
    enabled: ${SIMULATION_SEED_ENABLED:false}
    account-number: ${SIMULATION_ACCOUNT_NUMBER:A-1001}
    account-holder: ${SIMULATION_ACCOUNT_HOLDER:Alice}
    opening-balance: ${SIMULATION_OPENING_BALANCE:2000000.00}
